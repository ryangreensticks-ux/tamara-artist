# Site editor settings for Tamara Artist
# --------------------------------------
# Before the first login, replace YOUR-GITHUB-USERNAME/tamara-artist below
# with your own GitHub username and the name of your site's repository.

backend:
  name: github
  repo: ryangreensticks-ux/tamara-artist
  branch: main
  # GitHub Pages has no login server, so the editor signs in with a GitHub access token
  auth_methods: [token]
  commit_messages:
    update: "Update {{collection}}"
    uploadMedia: "Upload {{path}}"

site_url: https://ryangreensticks-ux.github.io/tamara-artist/
display_url: https://ryangreensticks-ux.github.io/tamara-artist/
logo_url: ../images/uploads/site-images/me.jpg

# Where uploaded photos are stored in the site
media_folder: images/uploads
public_folder: /images/uploads

# Shrink big phone photos before they are uploaded (Sveltia CMS)
media_libraries:
  default:
    config:
      max_file_size: 20000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:

  # ---------------- PET PORTRAITS ----------------
  # One page per medium. The site reads content/pet-<medium>.json.
  - name: pet-portraits
    label: Pet portraits
    icon: pets
    files:
      - name: pet-pencil
        label: Pencil portraits
        file: content/pet-pencil.json
        media_folder: /images/uploads/pet-portraits/pencil
        public_folder: /images/uploads/pet-portraits/pencil
        fields:
          - name: items
            label: Pencil portraits
            label_singular: portrait
            widget: list
            add_to_top: true
            thumbnail: image
            summary: "{{fields.title}}{{fields.featured | ternary(' · ★ Recent', '')}}"
            hint: "New portraits appear at the top of the Pencil page. Drag to reorder."
            fields:
              - { name: image, label: Photo, widget: image, hint: "Upload the clearest photo of the finished portrait." }
              - { name: title, label: Title, widget: string, hint: "Shown when someone enlarges the image, e.g. Border collie" }
              - { name: featured, label: "Show in Recent Portraits", widget: boolean, default: false, required: false, hint: "Also show it on the main Pet Portraits page." }

      - name: pet-ink
        label: Ink portraits
        file: content/pet-ink.json
        media_folder: /images/uploads/pet-portraits/ink
        public_folder: /images/uploads/pet-portraits/ink
        fields:
          - name: items
            label: Ink portraits
            label_singular: portrait
            widget: list
            add_to_top: true
            thumbnail: image
            summary: "{{fields.title}}{{fields.featured | ternary(' · ★ Recent', '')}}"
            hint: "New portraits appear at the top of the Ink page. Drag to reorder."
            fields:
              - { name: image, label: Photo, widget: image, hint: "Upload the clearest photo of the finished portrait." }
              - { name: title, label: Title, widget: string, hint: "Shown when someone enlarges the image, e.g. Border collie" }
              - { name: featured, label: "Show in Recent Portraits", widget: boolean, default: false, required: false, hint: "Also show it on the main Pet Portraits page." }

      - name: pet-colour
        label: Colour pencil portraits
        file: content/pet-colour.json
        media_folder: /images/uploads/pet-portraits/colour-pencil
        public_folder: /images/uploads/pet-portraits/colour-pencil
        fields:
          - name: items
            label: Colour pencil portraits
            label_singular: portrait
            widget: list
            add_to_top: true
            thumbnail: image
            summary: "{{fields.title}}{{fields.featured | ternary(' · ★ Recent', '')}}"
            hint: "New portraits appear at the top of the Colour pencil page. Drag to reorder."
            fields:
              - { name: image, label: Photo, widget: image, hint: "Upload the clearest photo of the finished portrait." }
              - { name: title, label: Title, widget: string, hint: "Shown when someone enlarges the image, e.g. Border collie" }
              - { name: featured, label: "Show in Recent Portraits", widget: boolean, default: false, required: false, hint: "Also show it on the main Pet Portraits page." }

